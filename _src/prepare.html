<main class="wrap">
 <h1 style="margin-top:1.4rem">行前準備</h1>
 <p class="lead">勾選狀態只存在你自己的手機或電腦，三個人各自勾各自的。</p>
 <section class="tk-check">
  <h2>勾選清單 <span class="small ck-count"></span></h2>
  <ul class="check">
   <li><label><input type="checkbox" id="ck-flight-track"><span>在 Google Flights 設好機票價格追蹤</span></label></li>
   <li><label><input type="checkbox" id="ck-flight"><span>買機票（盡量選羽田）</span></label></li>
   <li><label><input type="checkbox" id="ck-brother"><span>確認哥哥從韓國抵達的日期、時間、機場</span></label></li>
   <li><label><input type="checkbox" id="ck-aunt"><span>確認姑姑朋友家在哪一站，決定姑姑住哪裡</span></label></li>
   <li><label><input type="checkbox" id="ck-hotel"><span>訂哥哥（和姑姑）的飯店，先選可免費取消的房型</span></label></li>
   <li><label><input type="checkbox" id="ck-hp"><span>買哈利波特影城門票（指定日期與時段）</span></label></li>
   <li><label><input type="checkbox" id="ck-disney"><span>（備案）迪士尼門票：3/18 的 1/18、3/19 的 1/19 14:00 開賣</span></label></li>
   <li><label><input type="checkbox" id="ck-passport"><span>護照效期與身分證字號頁</span></label></li>
   <li><label><input type="checkbox" id="ck-vjw"><span>Visit Japan Web 填好入境資料（網頁，不是 App）</span></label></li>
   <li><label><input type="checkbox" id="ck-suica"><span>iPhone：錢包加入 Suica／Android：準備買實體卡</span></label></li>
   <li><label><input type="checkbox" id="ck-apps"><span>裝好 <a href="apps.html">必裝 App</a></span></label></li>
   <li><label><input type="checkbox" id="ck-cash"><span>準備日圓現金（老居酒屋、商店街很多只收現金）</span></label></li>
   <li><label><input type="checkbox" id="ck-esim"><span>網路：eSIM 或漫遊</span></label></li>
   <li><label><input type="checkbox" id="ck-gift"><span>給朋友的伴手禮</span></label></li>
  </ul>
 </section>
 <section class="tk-fx card" style="margin-top:1.5rem">
  <h3>匯率設定</h3>
  <p class="small">網站上的日圓會自動換算成台幣。預設 0.21 只是假設值，請改成你查到的實際匯率（1 日圓 = ? 台幣）。</p>
  <div class="fx"><label for="fx-in">1 円 =</label><input id="fx-in" type="number" step="0.001" min="0.05" max="1" inputmode="decimal"><span>NT$</span></div>
  <p class="small fx-ok" aria-live="polite"></p>
 </section>
 <h2>機票</h2>
 <div class="grid tk-facts" data-keys="台灣→東京直飛航線|Google Flights 追蹤機票價格|羽田機場→戶越站|成田機場→戶越站"></div>
 <h2>交通卡</h2>
 <div class="grid tk-facts" data-keys="實體 Suica／PASMO 現況|Welcome Suica（實體卡）|手機 Suica（iPhone）|Android 手機能不能用 Suica|Tokyo Subway Ticket"></div>
 <h2>入境、退稅與稅金</h2>
 <div class="grid tk-facts" data-keys="台灣護照免簽|Visit Japan Web|免稅改為退稅制（2026/11/1起）|出國稅（國際觀光旅客稅）漲價|JESTA（日本版電子旅行許可）|緊急電話"></div>
 <h2>日期與季節</h2>
 <div class="grid tk-facts" data-keys="2027年春分之日與連假|春分之日的法定意義|東京櫻花平年值|2027年櫻花預測"></div>
 <div class="tk-claims claims" data-r="f"></div>
</main>
