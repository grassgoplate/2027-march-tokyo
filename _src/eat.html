 <h1 style="margin-top:1.4rem">居酒屋、喫茶店與咖啡</h1>
 <p class="lead">一共 {{n:eat}} 家，以在地人去的平價店為主。很多老店只收現金、週末休息，坐下後還會先上一道收費小菜（お通し）。這些都寫在卡片正面。</p>
 <div class="callout warn"><h3>⚠️ 連假三天（3/20～3/22）不開或可能不開</h3><p>秋田屋、快生軒、新日の基（週日）、笹新、新橋站前大樓多數店、合羽橋多數店；湯島 Shinsuke、根岸鍵屋週日與國定假日休。另外，鍵屋不接待只有女性的客人，要有男性同行。</p></div>
